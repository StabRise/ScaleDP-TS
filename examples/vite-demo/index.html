<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>scaledp-ts demo</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
      #drop { border: 2px dashed #999; border-radius: 8px; padding: 3rem; text-align: center; }
      #drop.over { border-color: #06c; background: #f0f6ff; }
      #status { white-space: pre-wrap; font-family: ui-monospace, monospace; }
      canvas { max-width: 100%; border: 1px solid #ddd; margin-top: 1rem; }
      table { border-collapse: collapse; margin-top: 1rem; }
      td, th { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
    </style>
  </head>
  <body>
    <h1>scaledp-ts</h1>
    <p>Everything runs in this tab. No document is uploaded anywhere.</p>

    <label><input type="checkbox" id="ner" /> Run NER (downloads ~333&nbsp;MB the first time)</label>
    <div id="drop">Drop a PDF or image here, or click to choose.</div>
    <input type="file" id="file" accept="application/pdf,image/*" hidden />

    <div id="status"></div>
    <div id="timings"></div>
    <div id="entities"></div>
    <canvas id="canvas"></canvas>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
