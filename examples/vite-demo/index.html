<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>scaledp-ts — read documents in the browser</title>

    <!-- crossorigin is required: the page sets COEP require-corp for threaded
         WASM, which blocks cross-origin subresources unless they are CORS-fetched. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="rail">
      <div class="mark">
        <span class="mark__dot"></span>
        <span class="mark__name">scaledp<span class="mark__ts">-ts</span></span>
      </div>
      <div class="caps" id="caps" role="status"></div>
    </header>

    <main>
      <section class="stage">
        <h1 class="lede">
          Read a document <em>without sending it anywhere.</em>
        </h1>
        <p class="sub">
          Rendering, text detection, OCR and entity recognition all run in this
          tab, on WebAssembly or WebGPU. The file never leaves your machine.
        </p>

        <!-- The platen: the page's one signature element. Registration marks at
             the corners, and a scan line that sweeps while stages run. -->
        <button class="platen" id="drop" type="button">
          <span class="platen__reg platen__reg--tl" aria-hidden="true"></span>
          <span class="platen__reg platen__reg--tr" aria-hidden="true"></span>
          <span class="platen__reg platen__reg--bl" aria-hidden="true"></span>
          <span class="platen__reg platen__reg--br" aria-hidden="true"></span>
          <span class="platen__beam" aria-hidden="true"></span>
          <span class="platen__label" id="dropLabel">Drop a page</span>
          <span class="platen__hint" id="dropHint">PDF or image · click to browse</span>
        </button>
        <input type="file" id="file" accept="application/pdf,image/*" hidden />
        <div class="rerun" id="rerunRow" hidden>
          <button class="rerun__btn" id="rerun" type="button">Run again</button>
          <span class="rerun__note" id="rerunNote"></span>
        </div>
      </section>

      <section class="controls" aria-label="Models">
        <div class="ctrl">
          <span class="ctrl__key">OCR</span>
          <select id="ocrModel" aria-label="OCR model"></select>
          <span class="ctrl__state" id="ocrCache"></span>
        </div>

        <div class="ctrl">
          <span class="ctrl__key">Detect</span>
          <select id="detModel" aria-label="Text detector"></select>
          <span class="ctrl__state" id="detCache"></span>
        </div>

        <div class="ctrl">
          <span class="ctrl__key">Read</span>
          <select id="recModel" aria-label="Recognizer"></select>
          <span class="ctrl__state" id="recState"></span>
        </div>

        <div class="ctrl">
          <label class="switch">
            <input type="checkbox" id="orient" />
            <span class="switch__track"><span class="switch__knob"></span></span>
            <span class="ctrl__key">Orient</span>
          </label>
          <span class="ctrl__hint">Turn upside-down lines before reading them</span>
          <span class="ctrl__state" id="orientCache"></span>
        </div>

        <div class="ctrl">
          <label class="switch">
            <input type="checkbox" id="ner" />
            <span class="switch__track"><span class="switch__knob"></span></span>
            <span class="ctrl__key">NER</span>
          </label>
          <select id="nerModel" aria-label="NER model" disabled></select>
          <span class="ctrl__state" id="nerCache"></span>
        </div>

        <div class="ctrl ctrl--wide" id="labelsRow" hidden>
          <span class="ctrl__key">Labels</span>
          <input type="text" id="labels" aria-label="Entity labels" />
          <button class="ghost" id="resetLabels" type="button">Reset</button>
        </div>
      </section>

      <!-- The pipeline is genuinely ordered, and each stage's cost is real
           information, so the trace is bars of measured time rather than decor. -->
      <section class="trace" id="trace" hidden aria-label="Pipeline">
        <ol id="traceList"></ol>
        <p class="trace__total" id="traceTotal"></p>
      </section>

      <p class="note" id="note" role="status"></p>

      <section class="results" id="results" hidden>
        <div class="col col--page">
          <h2 class="col__head">Page<span id="pageMeta"></span></h2>
          <div class="framed" id="image"></div>
        </div>

        <div class="col col--read">
          <div class="tabs" role="tablist">
            <button class="tab is-on" data-panel="text" role="tab">Text</button>
            <button class="tab" data-panel="entities" role="tab" id="tabEntities" hidden>Entities</button>
            <button class="tab" data-panel="boxes" role="tab">Boxes</button>
            <button class="tab" data-panel="detect" role="tab" id="tabDetect" hidden>Detector</button>
          </div>

          <div class="panel is-on" data-panel="text">
            <div class="panel__bar">
              <span id="textMeta"></span>
              <span class="spacer"></span>
              <label class="chk"><input type="checkbox" id="wrap" /> Wrap</label>
              <button class="ghost" id="copy" type="button">Copy text</button>
            </div>
            <div class="scroll" id="text"></div>
          </div>

          <div class="panel" data-panel="entities">
            <div class="scroll" id="entities"></div>
            <h3 class="sub-head">In context</h3>
            <div class="scroll" id="nerText"></div>
          </div>

          <div class="panel" data-panel="boxes">
            <div class="scroll" id="boxes"></div>
          </div>

          <div class="panel" data-panel="detect">
            <p class="panel__note" id="detNote"></p>
            <div class="scroll" id="detBoxes"></div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
