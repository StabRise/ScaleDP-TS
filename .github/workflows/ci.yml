name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per branch: superseded runs waste minutes without adding signal.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # publint and attw check the published shape, which a green build does
      # not: exports maps break for consumers while the build stays happy.
      - run: pnpm check:pkg
